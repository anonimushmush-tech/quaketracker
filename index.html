<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QuakeTrack — Live Earthquake Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;}
body{background:#0f172a;color:#e2e8f0;min-height:100vh;padding:16px;}
.container{max-width:700px;margin:0 auto;}
.header{text-align:center;padding:20px 0 16px;}
.header h1{font-size:1.6rem;background:linear-gradient(90deg,#38bdf8,#818cf8,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;}
.header p{color:#64748b;font-size:.85rem;margin-top:4px;}
.stats{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;}
.stat-card{flex:1;min-width:100px;background:#1e293b;border-radius:12px;padding:12px;text-align:center;border:1px solid #334155;}
.stat-card .num{font-size:1.4rem;font-weight:800;color:#38bdf8;}
.stat-card .label{font-size:.7rem;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.filters{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap;}
.filter-btn{padding:8px 14px;border-radius:20px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:.8rem;cursor:pointer;transition:all .2s;}
.filter-btn.active{background:linear-gradient(90deg,#38bdf8,#818cf8);color:#fff;border:none;font-weight:600;}
.refresh-bar{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:.75rem;color:#64748b;}
.refresh-btn{background:none;border:none;color:#38bdf8;cursor:pointer;font-size:.8rem;padding:4px 8px;}
.quake-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.quake-card{display:flex;align-items:center;gap:12px;background:#1e293b;border-radius:12px;padding:12px;border:1px solid #334155;cursor:pointer;transition:transform .15s,border-color .15s;text-decoration:none;color:inherit;}
.quake-card:hover{transform:translateX(4px);border-color:#38bdf8;}
.mag-badge{min-width:52px;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;flex-shrink:0;}
.mag-badge .m-label{font-size:.55rem;font-weight:400;opacity:.8;}
.mag-green{background:#064e3b;color:#6ee7b7;}
.mag-yellow{background:#713f12;color:#fde047;}
.mag-orange{background:#7c2d12;color:#fdba74;}
.mag-red{background:#7f1d1d;color:#fca5a5;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.4)}50%{box-shadow:0 0 0 6px rgba(248,113,113,0)}}
.quake-info{flex:1;min-width:0;}
.quake-place{font-weight:600;font-size:.9rem;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.quake-meta{font-size:.75rem;color:#64748b;margin-top:3px;}
.quake-time{font-size:.7rem;color:#475569;flex-shrink:0;text-align:right;}
.loading{text-align:center;padding:40px;color:#64748b;}
.spinner{width:36px;height:36px;border:3px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.error{background:#7f1d1d;border:1px solid #ef4444;color:#fca5a5;padding:16px;border-radius:12px;text-align:center;margin-top:16px;}
.footer{text-align:center;padding:20px 0;color:#475569;font-size:.7rem;}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>QuakeTrack</h1>
    <p>Live Earthquake Tracker — Data from USGS</p>
  </div>

  <div class="stats" id="stats">
    <div class="stat-card"><div class="num" id="totalCount">--</div><div class="label">Total (24h)</div></div>
    <div class="stat-card"><div class="num" id="maxMag" style="color:#f87171;">--</div><div class="label">Strongest</div></div>
    <div class="stat-card"><div class="num" id="avgMag" style="color:#fde047;">--</div><div class="label">Avg Mag</div></div>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="m1">M1.0+</button>
    <button class="filter-btn" data-filter="m2.5">M2.5+</button>
    <button class="filter-btn" data-filter="m4.5">M4.5+</button>
    <button class="filter-btn" data-filter="significant">Significant</button>
  </div>

  <div class="refresh-bar">
    <span id="lastUpdate">Loading...</span>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>

  <div class="quake-list" id="quakeList">
    <div class="loading"><div class="spinner"></div>Loading earthquake data...</div>
  </div>

  <div class="footer">Data: USGS Earthquake Hazards Program · Auto-refresh every 5 min</div>
</div>

<script>
var allQuakes=[];
var currentFilter='all';

function magClass(m){
  if(m>=6)return'mag-red';
  if(m>=4.5)return'mag-orange';
  if(m>=2.5)return'mag-yellow';
  return'mag-green';
}

function timeAgo(ts){
  var diff=Date.now()-ts;
  var mins=Math.floor(diff/60000);
  if(mins<1)return'Just now';
  if(mins<60)return mins+' min ago';
  var hrs=Math.floor(mins/60);
  if(hrs<24)return hrs+' hr ago';
  return Math.floor(hrs/24)+' day ago';
}

function formatTime(ts){
  return new Date(ts).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

function render(){
  var list=document.getElementById('quakeList');
  var filtered=allQuakes.filter(function(q){
    var m=q.properties.mag||0;
    if(currentFilter==='m1')return m>=1;
    if(currentFilter==='m2.5')return m>=2.5;
    if(currentFilter==='m4.5')return m>=4.5;
    if(currentFilter==='significant')return m>=5.5||q.properties.alert!==null;
    return true;
  });
  if(filtered.length===0){
    list.innerHTML='<div class="loading">No earthquakes match this filter</div>';
    return;
  }
  list.innerHTML=filtered.slice(0,50).map(function(q){
    var m=q.properties.mag||0;
    var place=q.properties.place||'Unknown location';
    var depth=q.geometry.coordinates[2];
    var url=q.properties.url;
    return '<a class="quake-card" href="'+url+'" target="_blank" rel="noopener">'
      +'<div class="mag-badge '+magClass(m)+'">'+m.toFixed(1)+'<div class="m-label">MAG</div></div>'
      +'<div class="quake-info"><div class="quake-place">'+place+'</div>'
      +'<div class="quake-meta">Depth: '+depth.toFixed(1)+' km</div></div>'
      +'<div class="quake-time">'+timeAgo(q.properties.time)+'</div></a>';
  }).join('');
}

function updateStats(){
  if(allQuakes.length===0)return;
  var mags=allQuakes.map(function(q){return q.properties.mag||0;});
  var max=Math.max.apply(null,mags);
  var avg=mags.reduce(function(a,b){return a+b;},0)/mags.length;
  document.getElementById('totalCount').textContent=allQuakes.length;
  document.getElementById('maxMag').textContent=max.toFixed(1);
  document.getElementById('avgMag').textContent=avg.toFixed(1);
}

function loadData(){
  var list=document.getElementById('quakeList');
  list.innerHTML='<div class="loading"><div class="spinner"></div>Loading earthquake data...</div>';
  fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson')
    .then(function(r){return r.json();})
    .then(function(data){
      allQuakes=data.features.sort(function(a,b){return b.properties.time-a.properties.time;});
      updateStats();
      render();
      document.getElementById('lastUpdate').textContent='Updated: '+formatTime(Date.now());
    })
    .catch(function(){
      list.innerHTML='<div class="error">Could not load data. Check your connection and tap Refresh.</div>';
    });
}

document.getElementById('refreshBtn').addEventListener('click',loadData);
document.querySelectorAll('.filter-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    currentFilter=btn.dataset.filter;
    render();
  });
});

loadData();
setInterval(loadData,300000);
</script>
</body>
</html>
